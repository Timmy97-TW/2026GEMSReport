<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GEMS Research · iGEM 2026 Report</title>
<meta name="description" content="GEMS Research 2026 report: dry lab, modelling and data analysis across the iGEM 2026 Top 10 and special prize teams, Science for Good practice, and the academic and industry trends shaping synthetic biology.">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:title" content="GEMS Research · iGEM 2026 Report">
<meta property="og:description" content="Dry lab, modelling, data analysis and Science for Good across iGEM 2026 — and the Drylab roadmap for GEMS Research.">
<meta property="og:url" content="https://timmy97-tw.github.io/2026GEMSReport/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230167EF'/%3E%3Ctext x='50' y='68' font-size='54' font-family='-apple-system,Helvetica,Arial' font-weight='700' fill='%23fff' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
<style>
:root{
  --blue:#0167EF; --blue2:#2887FF; --sky:#61ABFE; --ink-blue:#0A2540;
  --green:#00A86B; --green2:#00C98A; --mint:#E8F8F1;
  --violet:#7C5CFF; --amber:#E08700; --rose:#E5484D; --teal:#0E9BA8;
  --ink:#10151C; --ink2:#525E6E; --ink3:#8792A3; --ink4:#A9B2BF;
  --bg:#FFFFFF; --panel:#F6F8FA; --panel2:#FBFCFD; --card:#FFFFFF;
  --line:rgba(16,24,40,.10); --line2:rgba(16,24,40,.06);
  --r:16px; --rs:10px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
  --shadow2:0 2px 6px rgba(16,24,40,.06),0 18px 46px rgba(16,24,40,.10);
  --max:1180px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue","PingFang TC","Noto Sans TC",Arial,sans-serif;
  font-size:16.5px;line-height:1.55;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
html:lang(zh-Hant) body{letter-spacing:.005em;line-height:1.75}
html:lang(zh-Hant) h1,html:lang(zh-Hant) h2,html:lang(zh-Hant) h3,html:lang(zh-Hant) h4{letter-spacing:0;line-height:1.35}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
p,li{text-wrap:pretty}
img{max-width:100%;display:block;-webkit-user-drag:none}
::selection{background:rgba(1,103,239,.16)}
:focus-visible{outline:2px solid var(--blue2);outline-offset:3px;border-radius:8px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 22px}
.tnum{font-variant-numeric:tabular-nums}
.hide{display:none !important}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.82);
  backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
  box-shadow:0 1px 0 var(--line)}
.nav-in{max-width:var(--max);margin:0 auto;padding:0 22px;height:60px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);flex:none}
.brand:hover{text-decoration:none}
.brand .mk{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--green));
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;letter-spacing:-.03em;flex:none}
.brand .bw{display:flex;flex-direction:column;line-height:1.08}
.brand b{font-size:14.5px;font-weight:660}
.brand small{font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-top:3px}
.nact{margin-left:auto;display:flex;align-items:center;gap:10px}
.lang{position:relative;display:flex;background:var(--panel);border-radius:999px;padding:2px;box-shadow:inset 0 0 0 1px var(--line)}
.lang button{position:relative;z-index:1;font:inherit;font-size:11.5px;font-weight:650;border:0;background:none;color:var(--ink2);
  padding:5px 12px;border-radius:999px;cursor:pointer;transition:color .22s;min-width:44px}
.lang button.on{color:#fff}
.lang .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:0;border-radius:999px;background:var(--ink);transition:none}
.lang.ready .thumb{transition:transform .28s cubic-bezier(.2,.8,.2,1),width .28s}
.ghb{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink2);
  padding:7px 13px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);transition:background .2s}
.ghb:hover{background:var(--panel);text-decoration:none;color:var(--ink)}
.ghb svg{width:15px;height:15px;fill:currentColor}

/* ---------- tab bar ---------- */
.tabs{position:sticky;top:60px;z-index:55;background:rgba(255,255,255,.9);
  backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
  box-shadow:0 1px 0 var(--line)}
.tabs-in{max-width:var(--max);margin:0 auto;padding:0 22px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;font:inherit;font-size:13.5px;font-weight:570;color:var(--ink2);background:none;border:0;
  padding:13px 13px 12px;cursor:pointer;white-space:nowrap;transition:color .2s;display:flex;align-items:center;gap:7px}
.tab .ic{width:16px;height:16px;flex:none;opacity:.6;transition:opacity .2s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:650}
.tab.on .ic{opacity:1}
.tab:after{content:"";position:absolute;left:11px;right:11px;bottom:0;height:2px;border-radius:2px 2px 0 0;
  background:linear-gradient(90deg,var(--blue),var(--green));opacity:0;transform:scaleX(.5);transition:opacity .22s,transform .22s}
.tab.on:after{opacity:1;transform:none}

/* ---------- hero ---------- */
.hero{padding:62px 0 44px;background:
  radial-gradient(70% 120% at 88% -10%,rgba(0,168,107,.09),transparent 60%),
  radial-gradient(60% 110% at 8% 0%,rgba(1,103,239,.10),transparent 58%),
  var(--bg)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:650;letter-spacing:.1em;
  text-transform:uppercase;color:var(--blue)}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--green2);box-shadow:0 0 0 3px rgba(0,201,138,.2)}
html:lang(zh-Hant) .eyebrow{letter-spacing:.06em}
.hero h1{font-size:clamp(34px,5.4vw,58px);font-weight:700;margin:14px 0 14px;max-width:17em}
.hero h1 .gt{background:linear-gradient(100deg,var(--blue),var(--teal) 55%,var(--green));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lede{font-size:clamp(16.5px,1.6vw,19.5px);color:var(--ink2);max-width:46em;margin:0 0 26px}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px;max-width:820px}
.stat{background:var(--card);border-radius:var(--r);padding:16px 17px;box-shadow:inset 0 0 0 1px var(--line),var(--shadow)}
.stat .n{font-size:30px;font-weight:700;letter-spacing:-.04em;line-height:1;
  background:linear-gradient(140deg,var(--blue),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:11.5px;font-weight:600;color:var(--ink3);margin-top:8px;letter-spacing:.02em;line-height:1.35}

/* ---------- generic layout ---------- */
.sec{padding:52px 0}
.sec+.sec{border-top:1px solid var(--line2)}
.sechead{margin-bottom:26px;max-width:62em}
.sechead .k{font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
html:lang(zh-Hant) .sechead .k{letter-spacing:.07em}
.sechead h2{font-size:clamp(25px,3.1vw,36px);font-weight:700;margin:9px 0 10px}
.sechead p{font-size:16.5px;color:var(--ink2);margin:0}
h3.sub{font-size:20px;font-weight:660;margin:34px 0 14px;padding-top:14px;border-top:1px solid var(--line2)}
h3.sub:first-child{border-top:0;padding-top:0;margin-top:0}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(272px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(212px,1fr))}

.card{background:var(--card);border-radius:var(--r);padding:20px 21px;box-shadow:inset 0 0 0 1px var(--line),var(--shadow);
  transition:box-shadow .25s,transform .25s}
.card.lift:hover{box-shadow:inset 0 0 0 1px var(--line),var(--shadow2);transform:translateY(-2px)}
.card h4{font-size:16.5px;font-weight:660;margin-bottom:7px}
.card p{margin:0 0 10px;color:var(--ink2);font-size:14.8px}
.card p:last-child{margin-bottom:0}
.card .k{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:9px}
html:lang(zh-Hant) .card .k{letter-spacing:.06em}

.panel{background:var(--panel);border-radius:var(--r);padding:22px 23px;box-shadow:inset 0 0 0 1px var(--line2)}

/* evidence card: a figure from the team's own wiki, above the text */
.card.ev{padding:0;overflow:hidden;display:flex;flex-direction:column}
.card.ev>.k,.card.ev>h4,.card.ev>p,.card.ev>.chips{padding-left:21px;padding-right:21px}
.card.ev>.k{padding-top:17px}
.card.ev>p{flex:1}
.card.ev>.chips{padding-bottom:19px;margin-top:auto}
.card.ev>.chips:empty{padding-bottom:19px}
.evph{margin:0;aspect-ratio:16/9;overflow:hidden;background:linear-gradient(135deg,var(--panel),#EEF2F6)}
.evph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card.ev:hover .evph img{transform:scale(1.03)}
.evph.hide{display:none}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11.5px;font-weight:600;color:var(--ink2);background:var(--panel);border-radius:999px;padding:4px 10px;
  box-shadow:inset 0 0 0 1px var(--line2);white-space:nowrap;max-width:100%}
/* long award strings (village awards especially) must wrap on a phone rather than run off the card */
@media (max-width:620px){.chip{white-space:normal;border-radius:11px;line-height:1.45}}
/* and at ANY width: a village-award chip is long enough that flex shrinks it below its own
   text and the tail is silently clipped. Editorial chips are short and keep the pill shape. */
.chip.win{white-space:normal;border-radius:11px;line-height:1.45}
.chip.b{color:var(--blue);background:rgba(1,103,239,.07);box-shadow:inset 0 0 0 1px rgba(1,103,239,.16)}
.chip.g{color:#067a51;background:rgba(0,168,107,.08);box-shadow:inset 0 0 0 1px rgba(0,168,107,.18)}
.chip.v{color:#5B3BD4;background:rgba(124,92,255,.08);box-shadow:inset 0 0 0 1px rgba(124,92,255,.18)}
.chip.a{color:#9A5A00;background:rgba(224,135,0,.09);box-shadow:inset 0 0 0 1px rgba(224,135,0,.2)}
.chip.r{color:#C02B30;background:rgba(229,72,77,.07);box-shadow:inset 0 0 0 1px rgba(229,72,77,.18)}
.chip.win{color:#8A5A00;background:linear-gradient(135deg,rgba(255,196,0,.16),rgba(224,135,0,.1));
  box-shadow:inset 0 0 0 1px rgba(224,135,0,.3);font-weight:700}

/* ---------- team cards ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px}
.fbtn{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--card);border:0;border-radius:999px;
  padding:7px 14px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line);transition:all .2s}
.fbtn:hover{color:var(--ink);background:var(--panel)}
.fbtn.on{color:#fff;background:var(--ink);box-shadow:none}
.fsearch{flex:1;min-width:190px;max-width:300px;font:inherit;font-size:13.5px;color:var(--ink);background:var(--card);
  border:0;border-radius:999px;padding:8px 15px;box-shadow:inset 0 0 0 1px var(--line);outline:none}
.fsearch::placeholder{color:var(--ink4)}
.fsearch:focus{box-shadow:inset 0 0 0 1.5px var(--blue2)}

.tcard{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line),var(--shadow);
  display:flex;flex-direction:column;transition:box-shadow .25s,transform .25s}
.tcard:hover{box-shadow:inset 0 0 0 1px var(--line),var(--shadow2);transform:translateY(-2px)}
.tcard .ph{aspect-ratio:16/9;background:linear-gradient(135deg,var(--panel),#EEF2F6);overflow:hidden;position:relative}
.tcard .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.tcard:hover .ph img{transform:scale(1.03)}
.tcard .ph .no{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink4);font-size:12px;font-weight:600}
.tcard .bd{padding:17px 18px 19px;display:flex;flex-direction:column;flex:1}
.tcard .nm{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tcard .nm h4{font-size:17px;font-weight:680}
.tcard .nm .sec-l{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.tcard .pt{font-size:13.5px;font-weight:600;color:var(--blue);margin-top:5px}
.tcard .sm{font-size:14px;color:var(--ink2);margin:9px 0 0;flex:1}
.tcard .ft{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line2);
  font-size:12.5px;font-weight:600}
.tcard .ft .more{margin-left:auto;color:var(--ink3);cursor:pointer}

/* ---------- detail dialog ---------- */
dialog.sheet{width:min(960px,calc(100vw - 28px));max-height:calc(100dvh - 48px);margin:auto;padding:0;border:0;
  border-radius:22px;background:var(--bg);color:var(--ink);box-shadow:0 30px 90px rgba(16,24,40,.26);overflow:auto;
  overscroll-behavior:contain}
dialog.sheet::backdrop{background:rgba(16,24,40,.42);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
dialog.sheet[open]{animation:pop .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.985)}}
.sh-head{position:sticky;top:0;z-index:3;display:flex;align-items:flex-start;gap:16px;padding:24px 26px 16px;
  background:linear-gradient(var(--bg) 76%,rgba(255,255,255,0))}
.sh-head .x{flex:none;margin-left:auto;width:34px;height:34px;border-radius:50%;border:0;background:var(--panel);
  color:var(--ink2);font-size:19px;line-height:1;cursor:pointer}
.sh-head .x:hover{background:#E9EDF2;color:var(--ink)}
.sh-body{padding:0 26px 30px}
.sh-body h3{font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  margin:26px 0 10px;padding-top:16px;border-top:1px solid var(--line2)}
html:lang(zh-Hant) .sh-body h3{letter-spacing:.05em}
.sh-body h3:first-child{margin-top:4px;border-top:0;padding-top:0}
.sh-body p{font-size:15.2px;color:var(--ink2);margin:0 0 12px}
.sh-body p strong{color:var(--ink);font-weight:620}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0 4px}
.shot{border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line2)}
.shot img{width:100%;aspect-ratio:4/3;object-fit:cover}
.shot .cap{font-size:11.5px;color:var(--ink3);padding:8px 10px 10px;line-height:1.4}
.take{background:linear-gradient(135deg,rgba(1,103,239,.05),rgba(0,168,107,.05));border-radius:var(--r);
  padding:16px 18px;box-shadow:inset 0 0 0 1px rgba(1,103,239,.14);margin-top:8px}
.take .k{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.take p{margin:0;color:var(--ink);font-size:14.8px}

/* ---------- trend cards ---------- */
.trend{background:var(--card);border-radius:var(--r);padding:21px 22px;box-shadow:inset 0 0 0 1px var(--line),var(--shadow)}
.trend .top{display:flex;align-items:flex-start;gap:12px;margin-bottom:9px}
.trend h4{font-size:18px;font-weight:670;flex:1}
.trend .one{font-size:15px;color:var(--ink);font-weight:560;margin:0 0 11px}
.trend .bd{font-size:14.6px;color:var(--ink2);margin:0 0 12px}
.trend .box{background:var(--panel);border-radius:var(--rs);padding:13px 14px;margin-top:10px}
.trend .box .k{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
html:lang(zh-Hant) .trend .box .k{letter-spacing:.05em}
.trend .box p{font-size:14px;color:var(--ink2);margin:0}
.trend .box.act{background:linear-gradient(135deg,rgba(0,168,107,.06),rgba(1,103,239,.05));
  box-shadow:inset 0 0 0 1px rgba(0,168,107,.16)}
.trend .box.act .k{color:#067a51}
.refs{margin-top:12px;display:flex;flex-direction:column;gap:5px}
.refs a{font-size:12.5px;color:var(--ink2);display:flex;gap:7px;align-items:baseline}
.refs a:hover{color:var(--blue)}
.refs a .d{color:var(--ink4);flex:none;font-size:11px}

/* ---------- roadmap ---------- */
.rm{display:grid;gap:14px}
.phase{background:var(--card);border-radius:var(--r);padding:0;overflow:hidden;
  box-shadow:inset 0 0 0 1px var(--line),var(--shadow)}
.phase .hd{display:flex;align-items:center;gap:13px;padding:18px 21px;background:var(--panel2);
  box-shadow:inset 0 -1px 0 var(--line2)}
.phase .hd .n{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;
  font-size:14px;flex:none;background:linear-gradient(135deg,var(--blue),var(--teal))}
.phase .hd h4{font-size:17.5px;font-weight:670}
.phase .hd .w{font-size:11.5px;font-weight:650;color:var(--ink3);margin-left:auto;flex:none}
.phase .bd{padding:18px 21px 21px}
.phase ul{margin:0;padding-left:19px}
.phase li{font-size:14.8px;color:var(--ink2);margin-bottom:8px}
.phase li strong{color:var(--ink);font-weight:620}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  padding:9px 12px;border-bottom:1px solid var(--line)}
html:lang(zh-Hant) .tbl th{letter-spacing:.04em}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line2);color:var(--ink2);vertical-align:top}
.tbl tr:hover td{background:var(--panel2)}
.tbl td b{color:var(--ink);font-weight:620}
.scrollx{overflow-x:auto;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);background:var(--card)}
.scrollhint{display:none}
@media (max-width:620px){.scrollhint{display:block;margin:7px 2px 0;font-size:12px;color:var(--ink3)}}

/* loading / empty */
.load{padding:56px 0;text-align:center;color:var(--ink3);font-size:14px}
.spin{width:22px;height:22px;margin:0 auto 12px;border:2.5px solid var(--line);border-top-color:var(--blue);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* footer */
.foot{border-top:1px solid var(--line);padding:34px 0 46px;color:var(--ink3);font-size:13px}
.foot a{color:var(--ink2)}
.foot .fr{display:flex;flex-wrap:wrap;gap:18px;align-items:baseline}
.foot .fr .sp{margin-left:auto}

@media (max-width:760px){
  .nav-in{height:54px;padding:0 16px;gap:10px}
  .tabs{top:54px}
  .tabs-in{padding:0 16px}
  .wrap{padding:0 16px}
  .hero{padding:40px 0 32px}
  .sec{padding:40px 0}
  .ghb span{display:none}
  .brand small{display:none}
  .sh-head{padding:18px 18px 12px}
  .sh-body{padding:0 18px 24px}
}
@media print{.nav,.tabs,.foot{display:none}.pane{display:block !important}}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <a class="brand" href="#overview">
      <span class="mk">G</span>
      <span class="bw"><b data-en="GEMS Research" data-zh="GEMS Research">GEMS Research</b>
      <small data-en="iGEM 2026 Report" data-zh="iGEM 2026 報告">iGEM 2026 Report</small></span>
    </a>
    <div class="nact">
      <div class="lang" id="lang"><span class="thumb"></span>
        <button data-l="en" class="on">EN</button><button data-l="zh">中文</button>
